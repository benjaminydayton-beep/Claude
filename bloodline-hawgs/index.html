<title>Bloodline Hawgs</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a ranch registry. Header ledger strip, live hog yard over an ear-tagged herd board, the selected hog's file on the right. */
:root{
  --loam:#1b1612; --loam-2:#241e18; --loam-3:#30281f; --line:#463a2d;
  --fg:#efe6d8; --muted:#ab9c87; --tag:#f0c02e; --tag-ink:#231a04;
  --good:#86c46f; --warn:#e7a43c; --bad:#e3634f; --info:#8db7d4; --pink:#e59ab7; --glow:#9dffb6;
  --dirt-1:#4a3a29; --dirt-2:#3a2d20; --mud:#2a2018;
  --display:"Alfa Slab One", "Rockwell", "Roboto Slab", Georgia, serif;
  --body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme:dark;
}
html,body{background:var(--loam);color:var(--fg)}
body{font-family:var(--body);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--tag);outline-offset:2px}
.app{max-width:1360px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px;display:flex;flex-direction:column;gap:14px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:clamp(26px,4vw,38px);line-height:1}
h2{font-size:20px}
h3{font-size:15px}
p{margin:0}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px 24px;border-bottom:2px solid var(--line);padding-bottom:12px}
.brand{display:flex;flex-direction:column;gap:4px;margin-right:auto}
.brand h1 span{color:var(--tag)}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--mono);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.stat b.small{font-size:13.5px;font-family:var(--body)}
.neg{color:var(--bad)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{background:var(--loam-3);border:1px solid var(--line);border-radius:6px;padding:7px 12px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--tag);color:var(--tag-ink);border-color:var(--tag);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.small{padding:4px 9px;font-size:12.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.trapgrp{display:flex}
.trapgrp select{border-radius:6px 0 0 6px;border-right:none}
.trapgrp .btn{border-radius:0 6px 6px 0}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:16px;align-items:start}
@media (max-width:980px){.layout{grid-template-columns:minmax(0,1fr)}}
.tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:12px}
.tab{background:none;border:none;border-bottom:3px solid transparent;padding:8px 11px;color:var(--muted);font-weight:600}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--tag)}
.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--tag);margin-left:5px;vertical-align:middle}
.panel{background:var(--loam-2);border:1px solid var(--line);border-radius:10px;padding:14px}
.stack{display:flex;flex-direction:column;gap:14px}
.banner{border:2px solid var(--tag);background:color-mix(in srgb,var(--tag) 12%,var(--loam-2));border-radius:10px;padding:10px 14px}
.banner.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--loam-2))}
.banner.info{border-color:var(--info);background:color-mix(in srgb,var(--info) 10%,var(--loam-2))}

/* yard */
.yard{position:relative;isolation:isolate;height:220px;border-radius:10px;overflow:hidden;border:1px solid var(--line);margin-bottom:14px;
 background:radial-gradient(ellipse 120px 34px at 18% 78%,var(--mud) 0 70%,transparent 72%),repeating-linear-gradient(100deg,transparent 0 22px,rgba(0,0,0,.05) 22px 24px),linear-gradient(180deg,#2c3a22 0 16%,var(--dirt-1) 16% 60%,var(--dirt-2))}
.yard::before{content:"";position:absolute;inset:0 0 auto;height:34px;background:repeating-linear-gradient(90deg,#6b5a43 0 4px,transparent 4px 44px),linear-gradient(180deg,transparent 8px,#7a6750 8px 11px,transparent 11px 22px,#7a6750 22px 25px,transparent 25px);opacity:.8;pointer-events:none}
.yard .lbl{position:absolute;right:10px;bottom:6px;font-size:11px;color:#d9ccb6;opacity:.75;pointer-events:none}
.sprite{position:absolute;left:0;top:0;background:none;border:none;padding:0;will-change:transform}
.sprite .inner{display:block}
.sprite.face-l .inner{transform:scaleX(-1)}
.sprite svg{display:block;width:100%;height:auto}
.sprite.sel::after{content:"";position:absolute;left:15%;right:15%;bottom:-3px;height:4px;border-radius:2px;background:var(--tag)}
.sprite.scuffle .inner{animation:shake .45s}
.sprite .nm{position:absolute;left:50%;top:-14px;transform:translateX(-50%);font-family:var(--mono);font-size:10px;background:var(--tag);color:var(--tag-ink);padding:0 4px;border-radius:3px;white-space:nowrap;opacity:0;transition:opacity .15s}
.sprite:hover .nm,.sprite.sel .nm,.sprite:focus-visible .nm{opacity:1}
.dust{position:absolute;width:40px;height:22px;border-radius:50%;background:radial-gradient(#c9b38f,transparent 70%);pointer-events:none;animation:puff .6s forwards}
@keyframes shake{0%,100%{translate:0}20%{translate:-4px 0}40%{translate:4px -2px}60%{translate:-3px 0}80%{translate:3px 0}}
@keyframes puff{from{opacity:.9;transform:scale(.4)}to{opacity:0;transform:scale(1.6)}}

/* chute */
.chute{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.chute .slot{border:1px dashed var(--line);border-radius:8px;padding:8px 10px;min-height:62px;display:flex;align-items:center;gap:10px;min-width:0}
.chute .slot.filled{border-style:solid;background:var(--loam-3)}
.chute .slot svg{width:70px;flex:none}
.chute .pred{grid-column:1/-1;min-width:0}
.pred-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 16px;margin-top:8px}
.pred-grid>div{min-width:0}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--loam);margin:3px 0}
.bar i{display:block;height:100%}
.chip{display:inline-block;padding:1px 8px;border-radius:99px;font-family:var(--mono);font-size:12px;font-weight:600}
.c-ok{background:color-mix(in srgb,var(--good) 22%,transparent);color:var(--good)}
.c-mid{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn)}
.c-hi{background:color-mix(in srgb,var(--bad) 22%,transparent);color:var(--bad)}
.c-het{background:color-mix(in srgb,var(--info) 22%,transparent);color:var(--info)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
select{background:var(--loam-3);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit;max-width:100%}
.herd{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
.card{position:relative;text-align:left;background:var(--loam-2);border:1px solid var(--line);border-radius:10px;padding:10px 10px 9px;display:flex;flex-direction:column;gap:4px;min-width:0}
.card:hover{border-color:var(--muted)}
.card.sel{border-color:var(--tag);box-shadow:0 0 0 1px var(--tag)}
.row{display:flex;justify-content:space-between;gap:6px;align-items:center}
.card .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.facts{font-family:var(--mono);font-size:11.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 8px}
.card svg{width:100%;height:auto;max-width:100%}
.tag{position:relative;display:inline-flex;align-items:center;background:var(--tag);color:var(--tag-ink);font-family:var(--mono);font-weight:600;font-size:12px;padding:1px 7px 1px 15px;border-radius:9px 4px 4px 9px}
.tag::before{content:"";position:absolute;left:5px;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:var(--loam-2)}
.tag.rival{background:var(--info)}
.sex{font-family:var(--mono);font-weight:600}
.sex.M{color:var(--info)} .sex.F{color:var(--pink)}
.pill{display:inline-block;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:1px 6px;border-radius:4px;background:var(--loam-3);color:var(--muted)}
.pill.preg{background:color-mix(in srgb,var(--pink) 25%,transparent);color:#f0b6cb}
.pill.frail{background:color-mix(in srgb,var(--bad) 25%,transparent);color:var(--bad)}
.pill.legend,.pill.blue{background:var(--tag);color:var(--tag-ink)}
.pill.young{background:color-mix(in srgb,var(--info) 22%,transparent);color:var(--info)}
.pill.glow{background:color-mix(in srgb,var(--glow) 25%,transparent);color:var(--glow)}
.detail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 20px);overflow:auto}
@media (max-width:980px){.detail{position:static;max-height:none}}
.dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0}
.dl dt{color:var(--muted)}
.dl dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums;min-width:0}
.sect{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.gt{display:grid;grid-template-columns:auto auto 1fr;gap:3px 10px;font-family:var(--mono);font-size:12.5px;align-items:baseline}
.gt .loc{color:var(--muted)}
.gt .al{font-weight:600}
.ped{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:12.5px}
.link{background:none;border:none;padding:0;text-align:left;color:var(--tag);text-decoration:underline;text-underline-offset:2px}
.btnrow{display:flex;flex-wrap:wrap;gap:6px}
.good{color:var(--good)} .warn{color:var(--warn)} .bad{color:var(--bad)} .info{color:var(--info)}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.contract{display:flex;flex-direction:column;gap:6px}
.contract ul{margin:0;padding-left:18px;font-size:13px}
.reward{font-family:var(--mono);font-weight:600;color:var(--tag);font-size:18px}
.legend-box{border-color:var(--tag)}
.check{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:2px;font-size:13px}
.check li::before{content:"\25cb  ";color:var(--muted)}
.check li.ok::before{content:"\25cf  ";color:var(--good)}
.stud svg{width:110px}
.stud{display:flex;gap:10px;align-items:flex-start}
.stud>div{min-width:0}
.fairtbl{width:100%;border-collapse:collapse;font-size:13px}
.fairtbl td,.fairtbl th{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left}
.fairtbl th{color:var(--muted);font-weight:600}
.fairtbl tr.me td{color:var(--tag);font-weight:600}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.dexc{background:var(--loam-2);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:3px;text-align:left;min-width:0}
.dexc.found{border-color:color-mix(in srgb,var(--tag) 55%,var(--line))}
.dexc svg{width:100%;height:auto}
.dexc .h{font-weight:600}
.dexc.locked svg{opacity:.18;filter:grayscale(1) brightness(.2)}
.dexc .hint{font-size:11.5px;color:var(--muted)}
.progress{height:10px;border-radius:5px;background:var(--loam);overflow:hidden}
.progress i{display:block;height:100%;background:var(--tag)}
.log{font-family:var(--mono);font-size:12.5px;display:flex;flex-direction:column;gap:3px;max-height:70vh;overflow:auto}
.log .s{color:var(--tag)}
.guide{max-width:72ch;display:flex;flex-direction:column;gap:10px}
.math{font-family:"Cambria Math","STIX Two Math","Latin Modern Math",Georgia,serif;font-size:15px;font-style:italic;white-space:nowrap}
.math .up{font-style:normal}
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;font-size:12.5px;width:100%}
th,td{text-align:left;padding:4px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--tag);color:var(--tag-ink);font-weight:600;padding:8px 14px;border-radius:8px;max-width:calc(100% - 32px);z-index:40}

/* season report overlay */
.overlay{position:fixed;inset:0;z-index:30;background:rgba(10,8,6,.78);display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 16px) max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(12px,env(safe-area-inset-left,0px));overflow:auto}
.sheet{background:var(--loam-2);border:2px solid var(--tag);border-radius:12px;max-width:920px;width:100%;padding:18px;display:flex;flex-direction:column;gap:16px}
.litter{display:flex;flex-direction:column;gap:8px}
.piglets{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:8px}
.pig{background:var(--loam-3);border:1px solid var(--line);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:3px;text-align:left;min-width:0;animation:flip .5s both;animation-delay:calc(var(--i) * .3s)}
.pig.still{background:var(--loam);border-style:dashed;color:var(--muted);justify-content:center;min-height:96px}
.pig.rare{border-color:var(--tag);box-shadow:0 0 0 1px var(--tag),0 0 18px color-mix(in srgb,var(--tag) 35%,transparent)}
.pig.glowing{border-color:var(--glow);box-shadow:0 0 22px color-mix(in srgb,var(--glow) 50%,transparent)}
.pig svg{width:100%;height:auto}
.pig .b{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--tag)}
@keyframes flip{from{opacity:0;transform:perspective(500px) rotateY(85deg) scale(.9)}to{opacity:1;transform:none}}
.evts{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
:root.feral{--loam:#1f0d0b;--loam-2:#2c1210;--loam-3:#3d1a15;--line:#6b2a20;--tag:#ff5a2e;--tag-ink:#1a0603;--muted:#c99a8c;--dirt-1:#4d2418;--dirt-2:#3a1a12;--mud:#2a0f0a}
.feral-badge{display:inline-block;background:var(--bad);color:#1a0603;font-family:var(--display);font-size:13px;padding:2px 8px;border-radius:4px;letter-spacing:.08em;transform:rotate(-3deg)}
:root.feral h1{animation:rage 2.4s infinite}
:root.feral .card:hover svg{animation:shake .4s}
@keyframes rage{0%,92%,100%{transform:none}94%{transform:translate(-2px,1px) rotate(-.6deg)}96%{transform:translate(2px,-1px) rotate(.6deg)}98%{transform:translate(-1px,0)}}
@media (prefers-reduced-motion:reduce){:root.feral h1,:root.feral .card:hover svg{animation:none}.pig{animation:none}.sprite.scuffle .inner{animation:none}.dust{display:none}}
@media (max-width:540px){.chute{grid-template-columns:1fr}.herd{grid-template-columns:repeat(2,minmax(0,1fr))}.yard{height:180px}}
</style>

<div class="overlay" id="overlay" hidden></div>

<script>
"use strict";
/* ================= RNG (seedable so challenges replay) ================= */
let RS=(Date.now()^0x9e3779b9)>>>0;
function rnd(){RS=(RS+0x6D2B79F5)>>>0;let t=RS;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}
function gauss(){let u=0;while(!u)u=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*rnd())}
function wpick(vals,w){let r=rnd(),s=0;for(let i=0;i<vals.length;i++){s+=w[i];if(r<s)return vals[i]}return vals[vals.length-1]}
function pick(a){return a[Math.floor(rnd()*a.length)]}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ================= GENETIC MODEL ================= */
const CHROMS=[{id:'1',len:200},{id:'4',len:140},{id:'6',len:150},{id:'8',len:130},{id:'13',len:140},{id:'X',len:120}];
const QT_VALS=[-1,0,1,2], QT_W=[.30,.40,.22,.08];
const LOCI=[
 {id:'MC1R',chr:'6',pos:10,type:'major',panel:'coat',alleles:['ED','EP','E','e'],freq:[.22,.10,.58,.10],name:'MC1R (extension)'},
 {id:'RYR1',chr:'6',pos:40,type:'major',panel:'health',alleles:['N','n'],freq:[.85,.15],name:'RYR1 (halothane)'},
 {id:'TK',chr:'6',pos:70,type:'major',panel:'ebv',alleles:['+','Tk'],freq:[1,0],mu:{from:'+',to:'Tk',rate:.002},name:'TK (great tusk, invented)'},
 {id:'T1',chr:'6',pos:90,type:'qt',trait:'tusk'},
 {id:'D6',chr:'6',pos:130,type:'load'},
 {id:'D8',chr:'8',pos:15,type:'load'},
 {id:'KIT',chr:'8',pos:45,type:'major',panel:'coat',alleles:['I','Be','i'],freq:[.07,.10,.83],name:'KIT (white/belt)'},
 {id:'S1',chr:'8',pos:58,type:'qt',trait:'size'},
 {id:'L1',chr:'8',pos:105,type:'qt',trait:'litter'},
 {id:'D1a',chr:'1',pos:10,type:'load'},
 {id:'S2',chr:'1',pos:35,type:'qt',trait:'size'},
 {id:'A1',chr:'1',pos:80,type:'qt',trait:'temper'},
 {id:'WOL',chr:'1',pos:110,type:'major',panel:'coat',alleles:['+','wo'],freq:[.98,.02],name:'WOL (woolly coat)'},
 {id:'T2',chr:'1',pos:140,type:'qt',trait:'tusk'},
 {id:'D1b',chr:'1',pos:185,type:'load'},
 {id:'S3',chr:'4',pos:20,type:'qt',trait:'size'},
 {id:'D4',chr:'4',pos:50,type:'load'},
 {id:'L2',chr:'4',pos:75,type:'qt',trait:'litter'},
 {id:'DIL',chr:'4',pos:100,type:'major',panel:'coat',alleles:['D','dl'],freq:[.97,.03],name:'DIL (blue dilution, invented)'},
 {id:'A2',chr:'4',pos:120,type:'qt',trait:'temper'},
 {id:'MX',chr:'4',pos:135,type:'major',panel:'health',alleles:['Mx','+'],freq:[.15,.85],name:'MX (strain resistance, invented)'},
 {id:'D13a',chr:'13',pos:10,type:'load'},
 {id:'T3',chr:'13',pos:45,type:'qt',trait:'tusk'},
 {id:'A3',chr:'13',pos:70,type:'qt',trait:'temper'},
 {id:'WUR',chr:'13',pos:100,type:'major',panel:'health',alleles:['B','A'],freq:[.20,.80],name:'WUR (PRRS tolerance)'},
 {id:'GLW',chr:'13',pos:115,type:'major',panel:'coat',alleles:['+','Glo'],freq:[1,0],mu:{from:'+',to:'Glo',rate:.0012},name:'GLW (moonglow, invented)'},
 {id:'D13b',chr:'13',pos:130,type:'load'},
 {id:'DX',chr:'X',pos:20,type:'load'},
 {id:'RDG',chr:'X',pos:60,type:'major',panel:'coat',alleles:['R','r'],freq:[.12,.88],name:'RDG (ridgeback, X-linked, invented)'},
];
const LOC={}, CHR_LOCI={};
CHROMS.forEach(c=>CHR_LOCI[c.id]=[]);
LOCI.slice().sort((a,b)=>a.pos-b.pos).forEach(L=>{L.idx=CHR_LOCI[L.chr].length;CHR_LOCI[L.chr].push(L);LOC[L.id]=L});
const TRAIT={size:{eff:20,base:175,env:35,unit:'lb'},tusk:{eff:.45,base:2.2,env:.7,unit:'in'},temper:{eff:6,base:50,env:10,unit:''},litter:{eff:.4,base:6,env:1.0,unit:''}};
const QT_MEAN=QT_VALS.reduce((s,v,i)=>s+v*QT_W[i],0);
const QT_VAR=QT_VALS.reduce((s,v,i)=>s+QT_W[i]*(v-QT_MEAN)**2,0);
function nLoci(t){return LOCI.filter(L=>L.trait===t).length*2}
const H2={};for(const t in TRAIT){const g=nLoci(t)*QT_VAR*TRAIT[t].eff**2;const e=TRAIT[t].env**2+(t==='litter'?1.5**2:0);H2[t]=g/(g+e)}
const MU={};for(const t in TRAIT)MU[t]=TRAIT[t].base+TRAIT[t].eff*nLoci(t)*QT_MEAN;
const PANELS={
 coat:{name:'Coat & hair panel',cost:15,desc:'KIT, MC1R, DIL, WOL, RDG, GLW'},
 health:{name:'Health panel',cost:20,desc:'RYR1 stress gene, WUR and MX disease resistance'},
 ebv:{name:'Genomic EBV',cost:45,desc:'Breeding values for size, tusks, temper, litter, plus the TK gene'},

function sampleAllele(L,pop){
 if(L.type==='major'){const f=(pop.major&&pop.major[L.id])||L.freq;return wpick(L.alleles,f)}
 if(L.type==='qt')return wpick(QT_VALS,(pop.qt&&pop.qt[L.trait])||QT_W);
 return rnd()<(pop.load??.07)?1:0;
}
function popHap(pop){
 const h={};
 for(const c of CHROMS)h[c.id]=CHR_LOCI[c.id].map(L=>sampleAllele(L,pop));
 if(pop.kind==='wild'){
  if(h['8'][LOC.KIT.idx]==='Be'&&rnd()<.7)h['8'][LOC.S1.idx]=-1;
  if(h.X[LOC.RDG.idx]==='R'&&rnd()<.45)h.X[LOC.DX.idx]=1;
 }
 return h;
}
function meiosis(h){
 const g={};
 for(const c of CHROMS){
  if(c.id==='X'&&h.sex==='M'){g.X=rnd()<.5?null:h.mat.X.slice();continue}
  let s=rnd()<.5,prev=null;const arr=[];
  CHR_LOCI[c.id].forEach((L,k)=>{
   if(prev!=null){const d=(L.pos-prev)/100;if(rnd()<.5*(1-Math.exp(-2*d)))s=!s}
   prev=L.pos;arr.push((s?h.mat:h.pat)[c.id][k]);
  });
  g[c.id]=arr;
 }
 return g;
}
const MUT={major:.004,qt:.008,load:.002};
function mutate(g,notes){
 for(const c of CHROMS){
  if(!g[c.id])continue;
  CHR_LOCI[c.id].forEach((L,k)=>{
   const old=g[c.id][k];
   if(L.mu){if(old===L.mu.from&&rnd()<L.mu.rate){g[c.id][k]=L.mu.to;notes.push(`${L.id}: ${old}→${L.mu.to}`)}return}
   if(rnd()>=MUT[L.type])return;
   if(L.type==='major'){const o=L.alleles.filter(a=>a!==old);g[c.id][k]=pick(o);notes.push(`${L.id}: ${old}→${g[c.id][k]}`)}
   else if(L.type==='qt'){g[c.id][k]=clamp(old+(rnd()<.5?-1:1),-1,3);if(g[c.id][k]!==old)notes.push(`${L.id} (${L.trait}) ${old>g[c.id][k]?'−':'+'}1`)}
   else if(old===0){g[c.id][k]=1}
  });
 }
}
function gt(h,id){const L=LOC[id];const a=h.mat[L.chr][L.idx];const p=h.pat[L.chr];return [a,p?p[L.idx]:null]}
function topAllele(locus,pair){const o=DOM[locus];return o[Math.min(...pair.filter(x=>x!=null).map(a=>o.indexOf(a)))]}
function coatFrom(k,m,d){const kt=topAllele('KIT',k);if(kt==='I')return 'White';let b=BASECOAT[topAllele('MC1R',m)];if(d&&d[0]==='dl'&&d[1]==='dl')b=DILUTE[b];return kt==='Be'?b+' Belted':b}
function coatOf(h){return coatFrom(gt(h,'KIT'),gt(h,'MC1R'),gt(h,'DIL'))}
function trueBreeding(h){return ['KIT','MC1R','DIL'].every(id=>{const g=gt(h,id);return g[0]===g[1]})}
function ridge(h){const g=gt(h,'RDG');return h.sex==='M'?g[0]==='R':(g[0]==='R'&&g[1]==='R')}
function woolly(h){const g=gt(h,'WOL');return g[0]==='wo'&&g[1]==='wo'}
function glow(h){return gt(h,'GLW').includes('Glo')}
function tkCount(h){return gt(h,'TK').filter(a=>a==='Tk').length}
function nCount(h){return gt(h,'RYR1').filter(a=>a==='n').length}
function wurTol(h){return gt(h,'WUR').includes('B')}
function mxRes(h){return gt(h,'MX').includes('Mx')}
function protectedNow(h){const s=S.strain;return s==='A'?wurTol(h):s==='B'?mxRes(h):(wurTol(h)&&mxRes(h))}
function qsum(h,t){let s=0;for(const L of LOCI)if(L.trait===t){const g=gt(h,L.id);s+=g[0]+(g[1]??0)}return s}
function loadHomo(h){const out=[];for(const L of LOCI)if(L.type==='load'){const g=gt(h,L.id);if(L.chr==='X'&&h.sex==='M'?g[0]===1:(g[0]===1&&g[1]===1))out.push(L.id)}return out}
function carriers(h){return LOCI.filter(L=>L.type==='load').filter(L=>gt(h,L.id).includes(1)).map(L=>L.id)}

/* phenotypes */
const ageOf=h=>S.season-h.born;
const grown=h=>ageOf(h)>=2;
function matureWeight(h){let w=TRAIT.size.base+TRAIT.size.eff*qsum(h,'size')+h.env.size*TRAIT.size.env;w*=(1-.2*h.F)*(1+.08*(h.het||0));if(h.frail)w*=.85;if(h.quirk==='glutton')w*=1.06;if(h.quirk==='picky')w*=.95;if(h.sex==='F')w*=.88;return clamp(w,70,600)}
function weight(h){return matureWeight(h)*Math.min(1,.18+ageOf(h)*.27)}
function matureTusk(h){const t=TRAIT.tusk.base+TRAIT.tusk.eff*qsum(h,'tusk')+1.0*tkCount(h)+h.env.tusk*TRAIT.tusk.env;return Math.max(.4,t)*(h.sex==='M'?1:.3)}
function tusk(h){return matureTusk(h)*clamp((ageOf(h)-1)/7,.1,1)}
function temper(h){return clamp(Math.round(TRAIT.temper.base+TRAIT.temper.eff*qsum(h,'temper')+h.env.temper*TRAIT.temper.env),0,100)}
function lean(h){return 50+[0,2.5,7][nCount(h)]+h.env.lean*2-(woolly(h)?3:0)}
function litterMean(h){return TRAIT.litter.base+TRAIT.litter.eff*qsum(h,'litter')+h.env.litter*TRAIT.litter.env-6*h.F+1.5*(h.het||0)-(ageOf(h)>16?1.5:0)-(h.frail?1:0)}
function bestLitter(h){return h.litters.reduce((m,l)=>Math.max(m,l.alive),0)}
function ebv(h,t){return (qsum(h,t)-nLoci(t)*QT_MEAN)*TRAIT[t].eff}
function hetOf(a,b){let s=0;for(const k in a)s+=a[k]*(b[k]||0);return 1-s}
function makeup(h){return Object.entries(h.breed).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${Math.round(v*100)}% ${POPS[k].name}`).join(', ')}

/* pedigree coancestry */
let kinMemo=new Map();
function kin(a,b){
 if(a==null||b==null)return 0;
 if(a===b)return .5*(1+(H(a).F||0));
 const key=a<b?a+'_'+b:b+'_'+a;
 if(kinMemo.has(key))return kinMemo.get(key);
 const y=Math.max(a,b),o=Math.min(a,b),hy=H(y);
 const v=hy.sire==null?0:.5*(kin(o,hy.sire)+kin(o,hy.dam));
 kinMemo.set(key,v);return v;
}

 if(s.weightMin)r.push([`Weight ≥ ${s.weightMin} lb`,weight(h)>=s.weightMin]);

/* ================= PREDICTION ================= */
function gametes(h,id){const g=gt(h,id);return g[1]==null?[[g[0],1]]:[[g[0],.5],[g[1],.5]]}
function predictCoat(d,s){
 const res={};
 for(const [k1,p1] of gametes(d,'KIT'))for(const [k2,p2] of gametes(s,'KIT'))
 for(const [m1,q1] of gametes(d,'MC1R'))for(const [m2,q2] of gametes(s,'MC1R'))
 for(const [x1,r1] of gametes(d,'DIL'))for(const [x2,r2] of gametes(s,'DIL')){const c=coatFrom([k1,k2],[m1,m2],[x1,x2]);res[c]=(res[c]||0)+p1*p2*q1*q2*r1*r2}
 return Object.entries(res).sort((a,b)=>b[1]-a[1]);
}
const frac=(h,id,a)=>gt(h,id).filter(x=>x===a).length/2;
function predictRidge(d,s){const pR=frac(d,'RDG','R');return {sons:pR,daughters:gt(s,'RDG')[0]==='R'?pR:0}}
function predictRYR(d,s){const a=frac(d,'RYR1','n'),b=frac(s,'RYR1','n');return {nn:a*b,Nn:a*(1-b)+b*(1-a),NN:(1-a)*(1-b)}}
function predictProt(d,s){const w=1-frac(d,'WUR','A')*frac(s,'WUR','A');const m=1-frac(d,'MX','+')*frac(s,'MX','+');return S.strain==='A'?w:S.strain==='B'?m:w*m}
function predictLoad(d,s){
 let surv=1;
 for(const L of LOCI)if(L.type==='load'){
  const pd=frac(d,L.id,1);
  if(L.chr==='X'){const ps=gt(s,L.id)[0]===1?1:0;surv*=1-.75*(.5*pd+.5*pd*ps)}
  else{surv*=1-.75*pd*frac(s,L.id,1)}
 }
 return 1-surv;
}
function predQT(d,s,t){
 if(d.tested.ebv&&s.tested.ebv){let v=TRAIT[t].base+TRAIT[t].eff*(qsum(d,t)+qsum(s,t))/2;if(t==='tusk')v+=tkCount(d)/2+tkCount(s)/2;return {v,how:'gEBV'}}
 const mu=MU[t];
 if(t==='tusk'){if(ageOf(s)<8)return null;return {v:mu+H2.tusk/2*(matureTusk(s)-mu),how:'sire only, h²'}}
 if(t==='litter'){if(!d.litters.length)return null;const avg=d.litters.reduce((a,l)=>a+l.born,0)/d.litters.length;return {v:mu+H2.litter/2*(avg-mu),how:'dam record, h²'}}
 if(t==='size'){const pd=matureWeight(d)/.88,ps=matureWeight(s);return {v:mu+H2.size*((pd+ps)/2-mu),how:'midparent, h²'}}
 if(t==='temper')return {v:mu+H2.temper*((temper(d)+temper(s))/2-mu),how:'midparent, h²'};
}

const SND={ctx:null,on:true,last:0};
try{SND.on=localStorage.getItem('bloodline-hawgs-sound')!=='off'}catch(_){}
function actx(){if(!SND.on)return null;try{if(!SND.ctx)SND.ctx=new (window.AudioContext||window.webkitAudioContext)();if(SND.ctx.state==='suspended')SND.ctx.resume();return SND.ctx}catch(_){return null}}
function tone(f0,f1,dur,type,vol,delay=0){const c=actx();if(!c)return;const t=c.currentTime+delay;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(c.destination);o.start(t);o.stop(t+dur+.05)}
function grunt(delay=0,pitch=1){
 const c=actx();if(!c)return;const t=c.currentTime+delay,len=.3;
 const buf=c.createBuffer(1,Math.floor(c.sampleRate*len),c.sampleRate);const dd=buf.getChannelData(0);for(let i=0;i<dd.length;i++)dd[i]=Math.random()*2-1;
 const n=c.createBufferSource();n.buffer=buf;const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=320*pitch;f.Q.value=3;
 const g=c.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.9,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+len);
 const am=c.createGain();am.gain.value=0;const lfo=c.createOscillator();lfo.frequency.value=32;const lg=c.createGain();lg.gain.value=1;lfo.connect(lg).connect(am.gain);
 n.connect(f).connect(am).connect(g).connect(c.destination);n.start(t);lfo.start(t);n.stop(t+len);lfo.stop(t+len);
 tone(110*pitch,75*pitch,len,'sawtooth',.05,delay);
}
function sfx(k,delay=0){
 if(!SND.on)return;
 if(k==='grunt')grunt(delay,.85+Math.random()*.3);
 if(k==='squeal'){tone(900,1750,.16,'sine',.09,delay);tone(1750,1150,.14,'sine',.07,delay+.16)}
 if(k==='cash'){tone(1320,1320,.08,'triangle',.14,delay);tone(1760,1760,.28,'triangle',.14,delay+.08)}
 if(k==='chime')[660,880,1320,1760].forEach((f,i)=>tone(f,f,.35,'sine',.1,delay+i*.09));
 if(k==='fanfare')[523,659,784,1046].forEach((f,i)=>tone(f,f*1.001,i===3?.7:.16,'square',.05,delay+i*.15));
 if(k==='bad')tone(220,110,.5,'square',.05,delay);
}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let svgSeq=0;
function seeded(n){let x=n*9301+49297;return()=>((x=(x*9301+49297)%233280)/233280)}

function hogSVG(h){

 if(base==='Wild'||base==='Ash')extra+=`<path d="M26 34 Q58 18 90 32 L90 36 Q58 24 26 40Z" fill="${base==='Ash'?'#5d564d':'#3a2c1e'}" opacity=".8"/>`;
 if((base==='Wild'||base==='Ash')&&ageOf(h)<2)extra+=[36,42,48].map(y=>`<path d="M30 ${y} Q58 ${y-6} 86 ${y}" stroke="#d8b98a" stroke-width="1.6" fill="none" opacity=".75"/>`).join('');
 if(belt)extra+=`<rect x="62" y="20" width="16" height="50" fill="#efe5db"/>`;
 if(woolly(h)){const r2=seeded(h.id+7);for(let i=0;i<26;i++)extra+=`<circle cx="${26+r2()*60}" cy="${28+r2()*30}" r="${2.2+r2()*1.6}" fill="none" stroke="#00000040" stroke-width="1.1"/>`}
 if(h.quirk==='wallower')extra+=`<ellipse cx="44" cy="56" rx="16" ry="6" fill="#2a2018" opacity=".55"/>`;
 const legC=belt?'#efe5db':col;
 const g=glow(h);
 const halo=g?`<radialGradient id="g${u}"><stop offset="0" stop-color="#9dffb6" stop-opacity=".55"/><stop offset="1" stop-color="#9dffb6" stop-opacity="0"/></radialGradient><ellipse cx="62" cy="44" rx="56" ry="34" fill="url(#g${u})"/>`:'';
 const rid=ridge(h)?`<path d="${Array.from({length:14},(_,i)=>`${i?'L':'M'}${30+i*4} ${i%2?27:21+(i>9?3:0)}`).join(' ')}" stroke="${g?'#9dffb6':'#1e1815'}" stroke-width="2.2" fill="none" stroke-linejoin="round"/>`:'';
 const t=Math.min(10,(h.sex==='M'?tusk(h):tusk(h)*.6)*(S.feral?2:1));
 const tk=t>.6?`<path d="M101 50 q${3+t} ${-1-t*.6} ${2+t*.9} ${-4-t*2.2}" stroke="#f3ead6" stroke-width="${1.6+t*.25}" fill="none" stroke-linecap="round"/>`:'';
 return `<svg viewBox="0 0 120 78" role="img" aria-label="${esc(c)} ${h.sex==='M'?'boar':'sow'}">${halo}<g transform="translate(60 74) scale(${sc.toFixed(3)}) translate(-60 -74)">
 <ellipse cx="58" cy="74" rx="40" ry="3" fill="#000" opacity=".25"/>
 <clipPath id="c${u}"><ellipse cx="57" cy="44" rx="34" ry="19"/><path d="M82 30 L105 40 L106 52 L82 60Z"/></clipPath>
 <g fill="${col}"><rect x="33" y="52" width="7" height="20" rx="2"/><rect x="44" y="54" width="7" height="18" rx="2"/></g>
 <g fill="${legC}"><rect x="66" y="54" width="7" height="18" rx="2"/><rect x="75" y="52" width="7" height="20" rx="2"/></g>
 <path d="M24 40 q-7 -2 -6 -8 q1 -4 4 -1" stroke="${col}" stroke-width="2" fill="none"/>
 <g clip-path="url(#c${u})"><rect x="0" y="0" width="120" height="78" fill="${col}"/>${extra}</g>
 <g fill="none" stroke="${g?'#9dffb6':'#efe6d8'}" stroke-opacity="${g?.7:.32}" stroke-width="1.1"><ellipse cx="57" cy="44" rx="34" ry="19"/><path d="M84 31 L105 40 L106 52 L84 59"/><rect x="33" y="52" width="7" height="20" rx="2"/><rect x="75" y="52" width="7" height="20" rx="2"/></g>

 <ellipse cx="107" cy="46" rx="4" ry="6" fill="${skin}"/><circle cx="106.5" cy="44" r=".9" fill="#1a1412"/><circle cx="106.5" cy="48" r=".9" fill="#1a1412"/>

function Fchip(F){return `<span class="chip ${F<.0625?'c-ok':F<.125?'c-mid':'c-hi'}">F ${F.toFixed(3)}</span>`}
function hetChip(v){return v>0?`<span class="chip c-het">vigor ${Math.round(v*100)}%</span>`:''}
function pills(h){
 let p='';if(ageOf(h)<2)p+='<span class="pill young">piglet</span> ';if(h.preg)p+='<span class="pill preg">bred</span> ';if(h.frail)p+='<span class="pill frail">frail</span> ';if(glow(h))p+='<span class="pill glow">moonglow</span> ';
 const blue=h.ribbons.filter(r=>r.place===1).length;if(blue)p+=`<span class="pill blue">${blue} blue</span> `;

}

function slot(role){
 const id=S.pick[role];const h=id&&H(id);
 if(!h)return `<div class="slot"><div class="muted">${role==='dam'?'♀ Dam: open a sow and press “Use as dam”.':'♂ Sire: open a boar, or pick a stud in the Market.'}</div></div>`;
 return `<div class="slot filled">${hogSVG(h)}<div style="min-width:0"><div class="eyebrow">${role}${h.status==='stud'?` · stud fee $${h.fee}`:''}</div><div><span class="tag ${h.status==='stud'?'rival':''}">${pad(h.id)}</span> ${esc(h.name)}</div><div class="muted mono" style="font-size:12px">${coatOf(h)}, ${Math.round(weight(h))} lb</div></div><button class="btn small" style="margin-left:auto" data-act="unpick" data-role="${role}" aria-label="Clear ${role}">×</button></div>`;

function predictionHTML(){
 const d=H(S.pick.dam),s=H(S.pick.sire);if(!d||!s)return '<div class="muted">Fill both slots to see what this mating should produce.</div>';
 const F=kin(d.id,s.id),het=hetOf(d.breed,s.breed);const err=canBreed();
 const need=p=>`<span class="muted">Run the ${PANELS[p].name.toLowerCase()} on both parents.</span>`;
 const both=p=>d.tested[p]&&s.tested[p];
 let out=`<div class="row" style="flex-wrap:wrap"><div>Offspring ${Fchip(F)} ${hetChip(het)} <span class="muted">${F>=.25?'(full-sib level)':F>=.125?'(half-sib level)':F>0?'(related)':'(unrelated)'}</span></div><button class="btn primary" data-act="breed" ${err?'disabled':''} title="${esc(err||'')}">Breed this pair${s.status==='stud'?` ($${s.fee})`:''}</button></div>`;
 if(err)out+=`<div class="warn" style="font-size:12.5px">${esc(err)}</div>`;
 out+='<div class="pred-grid">';
 out+=`<div><div class="eyebrow">Coat</div>${both('coat')?bars(predictCoat(d,s)):need('coat')}</div>`;
 if(both('coat')){const r=predictRidge(d,s);const wo=frac(d,'WOL','wo')*frac(s,'WOL','wo');const gl=1-(1-frac(d,'GLW','Glo'))*(1-frac(s,'GLW','Glo'));out+=`<div><div class="eyebrow">Hair</div><div class="mono" style="font-size:12.5px">Ridgeback: sons ${(r.sons*100).toFixed(0)}%, daughters ${(r.daughters*100).toFixed(0)}%<br>Woolly ${(wo*100).toFixed(0)}%${gl>0?` · <span style="color:var(--glow)">Moonglow ${(gl*100).toFixed(0)}%</span>`:''}</div></div>`}
 if(both('health')){const r=predictRYR(d,s);out+=`<div><div class="eyebrow">RYR1 stress gene</div>${bars([['N/N',r.NN],['N/n',r.Nn],['n/n',r.nn]])}</div><div><div class="eyebrow">Resistant to ${STRAINS[S.strain].name}</div><div class="mono">${(predictProt(d,s)*100).toFixed(0)}% of piglets</div></div>`}else out+=`<div><div class="eyebrow">Health genes</div>${need('health')}</div>`;
 out+=`<div><div class="eyebrow">Known recessive stillbirth risk</div>${both('load')?`<div class="mono ${predictLoad(d,s)>.1?'bad':''}">${(predictLoad(d,s)*100).toFixed(1)}% per piglet</div>`:need('load')}</div>`;
 const qt=[['size','Mature weight (son)',v=>`${Math.round(v*(1-.2*F)*(1+.08*het))} lb`],['tusk','Mature tusks (son)',v=>`${v.toFixed(1)} in`],['temper','Temper',v=>`${Math.round(v)}`],['litter','Daughters’ litter',v=>`${(v-6*F+1.5*het).toFixed(1)}`]];
 out+=`<div style="grid-column:1/-1"><div class="eyebrow">Expected offspring means</div><div class="mono" style="display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px">${qt.map(([t,l,f])=>{const r=predQT(d,s,t);return `<span>${l}: ${r?`<b>${f(r.v)}</b> <span class="muted">(${r.how})</span>`:'<span class="muted">no data</span>'}</span>`}).join('')}</div></div>`;
 return out+'</div>';
}

 const W=640,rowH=44,top=10,x0=40,scale=(W-x0-20)/200;
 const col={major:'var(--tag)',qt:'var(--info)',load:'var(--bad)'};
 let s=`<svg viewBox="0 0 ${W} ${top+CHROMS.length*rowH+10}" width="${W}" style="max-width:none;display:block" role="img" aria-label="Chromosome map">`;

 });

function guideView(){
 const pct=v=>(v*100).toFixed(0)+'%';let best={};try{best=JSON.parse(localStorage.getItem(BESTKEY)||'{}')}catch(_){}
 const conf=S.confirm&&S.confirm.startsWith('new:')?S.confirm.slice(4):null;
 const newBtn=(id,label)=>conf===id?`<button class="btn danger" data-act="newgame" data-ch="${id}">Erase ranch and start</button><button class="btn" data-act="cancel">Keep playing</button>`:`<button class="btn ${id==='long'?'primary':''}" data-act="asknew" data-ch="${id}">${label}</button>`;
 return `<div class="guide">
 <div class="panel stack" style="gap:10px"><h2>New game</h2><p class="muted">Starting anything erases the current ranch.</p><div class="btnrow">${newBtn('long','New long game')}</div>
 <h3>Challenges</h3><p class="muted">Fixed starting herds and luck, so you and your friends play the same draw and compare times.</p>
 ${CHALLENGES.map(c=>`<div class="stack" style="gap:4px;border-top:1px solid var(--line);padding-top:8px"><div class="row"><b>${c.name}</b><span class="mono muted">${best[c.id]?`best: ${best[c.id]} seasons`:'unbeaten'}</span></div><p style="font-size:13px">${c.desc}</p><div class="btnrow">${newBtn(c.id,'Play '+c.name)}</div></div>`).join('')}</div>
 <h2>Field guide to hawg genetics</h2>
 <p>Every hog carries two copies of six chromosomes: one from its dam, one from its sire. You see phenotype. Genotypes stay hidden until you pay the lab.</p>
 <div class="panel scroll-x">${chromMap()}<div class="muted" style="font-size:12px;margin-top:4px"><span style="color:var(--tag)">■</span> major genes  <span style="color:var(--info)">■</span> trait loci (QTL)  <span style="color:var(--bad)">■</span> hidden recessive lethals (d)</div></div>
 <h3>Linkage</h3>
 <p>Loci on the same chromosome travel together. The chance a crossover splits two loci <span class="math">d</span> Morgans apart follows Haldane’s map function, <span class="math">r = ½(1 − e<sup>−2d</sup>)</span>. KIT and the size locus S1 sit 13 cM apart, and wild belted haplotypes usually carry a small-size allele there. The ridgeback allele on the X often rides with the DX lethal.</p>
 <h3>Coat genetics</h3>
 <p>KIT: <span class="mono">I &gt; Be &gt; i</span>. Dominant white hides everything else. MC1R: <span class="mono">ED &gt; EP &gt; E &gt; e</span> gives black, spotted, wild and red. Two copies of <span class="mono">dl</span> dilute those to slate, dapple, ash and fawn. True-breeding means homozygous at KIT, MC1R and DIL.</p>
 <h3>Sex linkage and sex limitation</h3>
 <p>Ridgeback is on the X. Boars (XY) show it with one copy, sows need two, and sons get their only X from the dam. Sows carry tusk genes but show about 30% of them. Litter size only shows in sows.</p>
 <h3>Quantitative traits</h3>
 <p>Heritability here: size ${pct(H2.size)}, tusks ${pct(H2.tusk)}, temper ${pct(H2.temper)}, litter ${pct(H2.litter)}. Without genomic tests the planner uses the breeder’s equation, <span class="math">E[offspring] = μ + h<sup>2</sup>(P̅<sub class="up">mid</sub> − μ)</span>, and for sex-limited traits only the expressing parent counts, with weight <span class="math">h<sup>2</sup>/2</span>.</p>
 <h3>Inbreeding and hybrid vigor</h3>
 <p>A piglet’s inbreeding equals its parents’ coancestry, <span class="math">F<sub class="up">X</sub> = ∑ (½)<sup>n<sub>1</sub>+n<sub>2</sub>+1</sup>(1 + F<sub class="up">A</sub>)</span>, summed over common ancestors <span class="math">A</span>. Inbreeding exposes hidden lethals and costs about 6 piglets per litter and 20% of body weight per unit of <span class="math">F</span>.</p>
 <p>Hybrid vigor runs the other way. Each region, breed and rival line counts as a separate population. A piglet’s vigor is the chance its two genes at a locus come from different populations:</p>
 <p class="math">h = 1 − ∑<sub class="up">b</sub> p<sub class="up">sire,b</sub> p<sub class="up">dam,b</sub></p>
 <p>An F1 cross of two populations has <span class="math">h = 1</span>. Each unit adds 8% to weight, 1.5 piglets per litter (through the dam), and cuts disease, crowding and stillbirth losses by 30%.</p>
 <h3>Disease that changes</h3>
 <p>PRRS comes in strains. Under strain A the WUR B allele protects. Under strain B only MX Mx does. Strain C needs both. The strain can change each spring, so keep both genes in the herd.</p>
 <h3>Real versus invented</h3>
 <div class="scroll-x"><table><tr><th>Locus</th><th>Status</th></tr>
 <tr><td class="mono">KIT, MC1R</td><td>Real pig coat genes, simplified.</td></tr>
 <tr><td class="mono">RYR1</td><td>Real halothane gene. n/n pigs are leaner and prone to porcine stress syndrome.</td></tr>
 <tr><td class="mono">WUR</td><td>Real marker in GBP5 linked to PRRS response. Strain-specific protection is invented.</td></tr>
 <tr><td class="mono">WOL</td><td>Inspired by the real curly coat of Mangalica pigs. Its inheritance here is simplified.</td></tr>
 <tr><td class="mono">DIL, MX, TK, GLW, RDG</td><td>Invented for the game: blue dilution, strain resistance, the great tusk gene, moonglow and ridgeback.</td></tr>
 <tr><td class="mono">QTL, d loci</td><td>Stand-ins. Real size and litter traits involve hundreds of small-effect loci.</td></tr>
 <tr><td>Breeds</td><td>Duroc (red), Hampshire (black belted), Large White (dominant white, prolific) and Mangalica (curly coat) are real breeds. Their stats here are approximate.</td></tr></table></div>
 <h3>Mutation</h3>
 <p>Genes mutate thousands of times faster than in real pigs. Moonglow and the great tusk gene only arise this way or, for Tk, from Hill Country stock and the Pruitt line.</p>
 <h3>Progress</h3>
 <p>Reputation comes from ribbons, contracts and Hogdex discoveries. Piney Woods trapping opens at 3, the breed catalog at 5, and Hill Country at 8.</p>
 </div>`;
}

function tick(t){

 if(!yard.el||!yard.el.isConnected||reduceMotion||document.hidden||!S)return;
 const W=yard.el.clientWidth,Hh=yard.el.clientHeight;
 for(const [id,sp] of yard.sprites){
  const h=H(id);if(!h)continue;
  if(sp.wait>0){sp.wait-=dt;continue}
  const dx=sp.tx-sp.x,dy=sp.ty-sp.y,dist=Math.hypot(dx,dy);

   if(sp.charge){const o=yard.sprites.get(sp.charge);sp.charge=null;if(o){[sp,o].forEach(z=>{z.el.classList.add('scuffle');setTimeout(()=>z.el.classList.remove('scuffle'),460)});const p=document.createElement('div');p.className='dust';p.style.left=(sp.x+sp.w*.6)+'px';p.style.top=(sp.y+sp.w*.4)+'px';p.style.zIndex=999;yard.el.appendChild(p);setTimeout(()=>p.remove(),650);if(S.tab==='herd'&&t-yard.grunt>(S.feral?1200:5000)){yard.grunt=t;sfx('grunt')}}}
   sp.wait=S.feral?Math.random()*.4:1+Math.random()*4;
   const dam=h.dam&&yard.sprites.get(h.dam);
   if(ageOf(h)<2&&dam&&Math.random()<.7){sp.tx=dam.x+(Math.random()*60-30);sp.ty=dam.y+15+Math.random()*20}
   else if(h.quirk==='wallower'&&Math.random()<.6){sp.tx=W*.18-sp.w/2+Math.random()*40-20;sp.ty=Hh*.78-sp.w*.55}
   else if((S.feral||temper(h)>78||h.quirk==='bully')&&(S.feral||grown(h))&&Math.random()<(S.feral?.6:.25)&&yard.sprites.size>1){const others=[...yard.sprites.keys()].filter(k=>k!==id);const o=yard.sprites.get(others[Math.floor(Math.random()*others.length)]);sp.charge=others.find(k=>yard.sprites.get(k)===o);sp.tx=o.x-sp.w*.5;sp.ty=o.y;sp.wait=0}
   else{sp.tx=Math.random()*(W-sp.w);sp.ty=30+Math.random()*(Hh-sp.w*.65-36)}
   sp.tx=clamp(sp.tx,0,W-sp.w);sp.ty=clamp(sp.ty,30,Hh-sp.w*.65);
   continue;
  }
  const step=Math.min(dist,speed*dt);sp.x+=dx/dist*step;sp.y+=dy/dist*step;if(Math.abs(dx)>1)sp.face=dx>0;place(sp);
 }
}

/* ================= MAIN RENDER ================= */
function render(){
 document.documentElement.classList.toggle('feral',!!S.feral);
 const hs=herd();const app=document.getElementById('app');
 const regions=['bottom','piney','hill'];const R=POPS[S.region];const nr=nextRep(S.rep);
 const ch=S.challenge&&CHALLENGES.find(c=>c.id===S.challenge);
 const fairOpen=!S.fair.judged&&S.fair.entries.some(e=>e==null)&&herd().some(grown);
 app.innerHTML=`<header class="top"><div class="brand"><div class="eyebrow">Hollow Creek Hog Works · ${repTitle(S.rep)}</div><h1>Bloodline <span>Hawgs</span></h1>${S.feral?'<div><span class="feral-badge">FERAL MODE</span></div>':''}</div>
 <div class="stats">
  <div class="stat"><span class="eyebrow">Season</span><b>${seasonName(S.season)}</b></div>
  <div class="stat"><span class="eyebrow">Cash</span><b class="${S.cash<0?'neg':''}">${S.cash<0?'−':''}$${Math.abs(Math.round(S.cash))}</b></div>
  <div class="stat"><span class="eyebrow">Pens</span><b class="${hs.length>S.cap?'neg':''}">${hs.length}/${S.cap}</b></div>
  <div class="stat"><span class="eyebrow">Reputation</span><b>${S.rep}${nr!=null?`<span class="muted" style="font-size:12px">/${nr}</span>`:''}</b></div>
  <div class="stat"><span class="eyebrow">PRRS</span><b class="small">${STRAINS[S.strain].name}</b></div>
  <div class="stat"><span class="eyebrow">Fashion</span><b class="small">${S.fashion}</b></div>
  ${S.drought?'<div class="stat"><span class="eyebrow">Weather</span><b class="small warn">Drought</b></div>':''}
 </div>
 <div class="actions">
  <div class="trapgrp"><label class="muted" for="rgn" style="position:absolute;left:-9999px">Trap region</label><select id="rgn" data-act="region">${regions.map(k=>`<option value="${k}" ${S.region===k?'selected':''} ${regionOpen(k)?'':'disabled'}>${POPS[k].name}${regionOpen(k)?'':` (rep ${POPS[k].rep})`}</option>`).join('')}</select><button class="btn" data-act="trap" title="${esc(R.desc)}">Trap $${R.cost}</button></div>
  <button class="btn" data-act="expand">Add pen $${expandCost()}</button>
  <button class="btn" data-act="sound" aria-pressed="${SND.on}" title="Sound">${SND.on?'Sound on':'Sound off'}</button>
  <button class="btn primary" data-act="advance" ${S.over?'disabled':''}>Next season ▸</button></div></header>
 ${S.over?`<div class="banner bad"><b>Foreclosed.</b> Hollow Creek lasted ${S.season} seasons. <button class="btn small" data-act="newgame" data-ch="long">Start a new ranch</button></div>`:''}
 ${ch?`<div class="banner ${S.chResult&&!S.chResult.win?'bad':'info'}"><b>Challenge: ${ch.name}.</b> ${ch.desc} ${S.chResult?(S.chResult.win?`Done in ${S.chResult.s} seasons.`:'Failed.'):`${ch.limit-S.season} seasons left.`}${S.feralUsed?' Feral mode was used, so this run won’t set a best time.':''}</div>`:''}
 <div class="layout"><main><nav class="tabs" role="tablist">${[['herd','Herd & breeding'],['fair','Fair'],['market','Market'],['dex','Hogdex'],['log','Ledger'],['guide','Guide & new game']].map(([k,l])=>`<button class="tab" role="tab" aria-selected="${S.tab===k}" data-act="tab" data-t="${k}">${l}${k==='fair'&&fairOpen?'<span class="dot" aria-label="entries open"></span>':''}</button>`).join('')}</nav>
 ${{herd:herdView,fair:fairView,market:marketView,dex:dexView,log:logView,guide:guideView}[S.tab]()}</main>
 <aside class="detail" id="detail">${detailView()}</aside></div>`;
 const ys=document.getElementById('yardSlot');if(ys){ensureYard();ys.replaceWith(yard.el);syncYard()}
}
let toastT;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}

/* ================= EVENTS ================= */
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b||b.tagName==='SELECT')return;
 const a=b.dataset.act,id=b.dataset.id?+b.dataset.id:null;
 if(a!=='asksell'&&a!=='asknew')S.confirm=null;
 switch(a){
  case 'sel':{S.sel=id;const h=H(id);if(b.classList.contains('sprite')){if(h)sfx(h.quirk==='loud'?'grunt':ageOf(h)<2?'squeal':'grunt')}else if(window.innerWidth<=980)requestAnimationFrame(()=>document.getElementById('detail').scrollIntoView({behavior:reduceMotion?'auto':'smooth',block:'start'}));break}
  case 'pigsel':S.sel=id;S.tab='herd';closeReport();break;
  case 'closerpt':closeReport();break;
  case 'pick':S.pick[b.dataset.role]=id;S.tab='herd';break;
  case 'unpick':S.pick[b.dataset.role]=null;break;
  case 'breed':breed();break;
  case 'test':test(id,b.dataset.p);break;
  case 'asksell':S.confirm='sell'+id;break;
  case 'sell':sell(id);break;
  case 'cancel':break;
  case 'deliver':deliver(+b.dataset.c,id);break;
  case 'trap':trap();break;
  case 'expand':expand();break;
  case 'buy':buyBreed(b.dataset.k,b.dataset.sex);break;
  case 'sound':SND.on=!SND.on;try{localStorage.setItem('bloodline-hawgs-sound',SND.on?'on':'off')}catch(_){}if(SND.on)sfx('grunt');break;
  case 'advance':advance();return;
  case 'tab':S.tab=b.dataset.t;break;
  case 'asknew':S.confirm='new:'+b.dataset.ch;break;
  case 'newgame':yard.sprites.forEach(sp=>sp.el.remove());yard.sprites.clear();newGame(b.dataset.ch==='long'?null:b.dataset.ch);closeReport();break;
 }
 save();render();
});
document.addEventListener('change',e=>{
 const t=e.target,a=t.dataset.act;if(!a)return;
 if(a==='filter')S.filter=t.value;if(a==='sort')S.sort=t.value;if(a==='region')S.region=t.value;
 if(a==='enter'){const i=+t.dataset.i;const v=t.value?+t.value:null;if(v!=null)S.fair.entries=S.fair.entries.map((x,j)=>j!==i&&x===v?null:x);S.fair.entries[i]=v}
 save();render();
});
let keyBuf='';
document.addEventListener('keydown',e=>{
 if(e.ctrlKey||e.metaKey||e.altKey||e.key.length!==1)return;const tg=e.target.tagName;if(tg==='INPUT'||tg==='TEXTAREA')return;
 keyBuf=(keyBuf+e.key.toLowerCase()).slice(-4);
 if(keyBuf==='hawg'){keyBuf='';S.feral=!S.feral;if(S.feral&&S.challenge&&!S.chResult)S.feralUsed=true;
  log(S.feral?'Something got into the hawgs. Feral mode is on.':'The hawgs settled down. Feral mode is off.',S.feral?'bad':null);
  toast(S.feral?'FERAL MODE. Type hawg again to calm them down.':'Feral mode off.');
  if(S.feral){sfx('grunt');sfx('grunt',.25);sfx('squeal',.5)}save();render()}
});
setInterval(()=>{if(S&&S.feral&&SND.ctx&&!document.hidden&&Math.random()<.6)sfx('grunt')},1800);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.getElementById('overlay').hidden){closeReport();render()}});
window.addEventListener('resize',()=>{if(S&&S.tab==='herd')syncYard()});

const KEY='bloodline-hawgs-v2',BESTKEY='bloodline-hawgs-best';
function save(){try{S.rs=RS;localStorage.setItem(KEY,JSON.stringify(S))}catch(_){}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.hogs&&s.season!=null&&s.dex){S=s;if(s.rs)RS=s.rs>>>0;return true}}catch(_){}return false}
function start(data){
 if(data&&data.S&&data.S.hogs){S=data.S;if(S.rs)RS=S.rs>>>0}else if(!load())newGame();
 kinMemo=new Map();render();
}
window.claude?.hot?.snapshot?.(()=>{S.rs=RS;return {S}});
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
