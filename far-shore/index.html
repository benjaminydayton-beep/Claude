<title>Far Shore</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: a tackle box at dusk. The lake view on top, a gauge strip under it, then drawers for the shop, the journal, the map and the log. */
:root{
  --night:#0e141c; --panel:#151e29; --panel-2:#1b2735; --edge:#2b3b4d; --edge-hi:#3e5469;
  --fg:#ebe5d6; --muted:#97a3ae; --lantern:#f2b84b; --lantern-ink:#2a1a04; --ember:#e26a42; --reed:#93c47d; --ice:#9fd2e4;
  --display:"Pixelify Sans", "Silkscreen", ui-monospace, monospace;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
html,body{background:var(--night);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--lantern);outline-offset:2px}
.screen:focus-visible{outline:none}
html,body{height:100%;overflow:hidden}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;letter-spacing:.02em;text-wrap:balance}
h1{font-size:clamp(28px,4.4vw,40px);line-height:1;font-weight:700}
h2{font-size:20px}
h3{font-size:16px}
p{margin:0}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.screen{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,#132230,#05080c 75%);touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer;overflow:hidden}
.view{position:relative;width:384px;height:216px;box-shadow:0 0 0 1px #0b1218,0 20px 60px rgba(0,0,0,.5)}
.view canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.hud{position:absolute;left:0;right:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px 12px;justify-content:space-between;pointer-events:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));transition:opacity .25s}
.hud-top{top:0;align-items:flex-start;padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:18px;background:linear-gradient(rgba(5,8,12,.62),rgba(5,8,12,0))}
.hud-bottom{bottom:0;align-items:flex-end;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px);padding-top:18px;background:linear-gradient(rgba(5,8,12,0),rgba(5,8,12,.62))}
.screen.fighting .hud-bottom{opacity:0}
.ctl{pointer-events:auto;cursor:default}
.brand{display:flex;flex-direction:column;gap:1px;min-width:0;text-shadow:0 2px 0 rgba(0,0,0,.6)}
.brand h1{font-size:clamp(20px,2.6vw,30px);line-height:1}
.brand h1 span{color:var(--lantern)}
.brand p{color:#d8d4c6;font-size:13px}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.stats{display:flex;gap:4px 16px;flex-wrap:wrap;justify-content:flex-end;text-shadow:0 2px 0 rgba(0,0,0,.6)}
.stat{display:flex;flex-direction:column;align-items:flex-end}
.stat small{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:#c4c8cc}
.stat b{font-family:var(--display);font-size:clamp(16px,1.8vw,20px);font-weight:600;font-variant-numeric:tabular-nums}
.stat b.cash{color:var(--lantern)}
.menubar{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.menubar .btn{padding:4px 10px;font-size:14px;background:rgba(21,30,41,.85)}
.menubar .btn.shop{background:var(--lantern);color:var(--lantern-ink);border-color:#ffd88a}
.chipbox{display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px 16px;background:rgba(13,19,27,.78);border:2px solid var(--edge);padding:6px 10px}
.rotate{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 140px);font-family:var(--display);font-size:13px;color:var(--muted);pointer-events:none;display:none;white-space:nowrap}
@media (orientation:portrait) and (max-width:700px){.rotate{display:block}}
.menu{position:fixed;inset:0;z-index:20;background:rgba(4,7,10,.62);display:flex;align-items:center;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(env(safe-area-inset-top,0px) + 12px) calc(env(safe-area-inset-bottom,0px) + 12px)}
.menu-win{width:min(1060px,100%);max-height:100%;display:flex;flex-direction:column;background:var(--panel);border:2px solid var(--lantern);box-shadow:0 6px 0 #05080c;min-height:0}
.menu-head{display:flex;align-items:flex-end;gap:8px 12px;flex-wrap:wrap;padding:10px 12px 0;border-bottom:2px solid var(--edge)}
.menu-head .tabs{border:none;flex:1;min-width:0}
.menu-head .mcash{font-family:var(--display);color:var(--lantern);font-size:18px;padding-bottom:8px;font-variant-numeric:tabular-nums}
.menu-head .close{margin-bottom:6px}
.menu .drawer{overflow:auto;border:none;min-height:0;flex:1}

.prompt{position:absolute;left:50%;top:21%;transform:translateX(-50%);font-family:var(--display);font-size:clamp(12px,2.2vw,20px);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.65);white-space:nowrap;pointer-events:none;letter-spacing:.03em}
.prompt.hot{color:var(--lantern);font-size:clamp(18px,4vw,36px);animation:throb .35s steps(2) infinite}
@keyframes throb{50%{transform:translateX(-50%) scale(1.08)}}
.toast{position:absolute;left:50%;top:33%;transform:translateX(-50%);background:rgba(10,14,20,.82);border:2px solid var(--edge-hi);padding:6px 12px;font-family:var(--display);font-size:clamp(12px,1.8vw,16px);pointer-events:none;opacity:0;transition:opacity .25s;max-width:90%;text-align:center}
.toast.on{opacity:1}
.meter{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);width:min(46%,360px);pointer-events:none}
.bar{height:clamp(8px,1.6vw,14px);background:rgba(8,12,18,.78);border:2px solid #0a0e14;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--lantern);width:0}
.fight{position:absolute;left:3%;right:3%;bottom:5%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 14px;pointer-events:none;font-family:var(--display);font-size:clamp(10px,1.5vw,14px);text-shadow:0 1px 0 #000}
.fight label{display:flex;justify-content:space-between;gap:6px;margin-bottom:2px}
.fight .tension i{background:linear-gradient(90deg,#7fcf6a 0 55%,#f2b84b 55% 82%,#e0533a 82%)}
.fight .tension.strain{animation:shake .1s steps(2) infinite}
@keyframes shake{50%{transform:translateX(2px)}}
.fight .stam i{background:#7fb7d9}
.fight .line i{background:#d8d2c0}
.fade{position:absolute;inset:0;background:#05080c;opacity:0;pointer-events:none;transition:opacity .45s;display:grid;place-items:center;font-family:var(--display);font-size:clamp(16px,3vw,28px);color:var(--fg)}
.fade.on{opacity:1}

.gauge{display:flex;flex-direction:column;min-width:0;text-shadow:0 1px 0 rgba(0,0,0,.6)}
.gauge small{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.gauge b{font-family:var(--display);font-weight:600;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.lure-pick{display:flex;flex-direction:column}
.lure-pick select{background:var(--panel-2);border:2px solid var(--edge-hi);padding:4px 6px;max-width:220px}
.btn{background:var(--panel-2);border:2px solid var(--edge-hi);padding:6px 12px;font-family:var(--display);font-size:15px;box-shadow:0 3px 0 #070a0e;transition:transform .05s}
.btn:hover{border-color:var(--lantern)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #070a0e}
.btn.primary{background:var(--lantern);color:var(--lantern-ink);border-color:#ffd88a}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:2px solid var(--edge)}
.tab{background:transparent;border:2px solid transparent;border-bottom:none;padding:8px 14px;font-family:var(--display);font-size:16px;color:var(--muted);margin-bottom:-2px}
.tab[aria-selected="true"]{background:var(--panel);border-color:var(--edge);color:var(--fg);box-shadow:inset 0 3px 0 var(--lantern)}
.drawer{background:var(--panel);border:2px solid var(--edge);border-top:none;padding:16px;min-height:200px}
.setup{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-bottom:14px}
.slot{text-align:left;background:var(--panel-2);border:2px solid var(--edge);padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.slot:hover{border-color:var(--edge-hi)}
.slot[aria-pressed="true"]{border-color:var(--lantern);box-shadow:inset 0 3px 0 var(--lantern)}
.slot small{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.slot b{font-family:var(--display);font-weight:600;font-size:15px}
.slot .next{font-size:12.5px;color:var(--muted)}
.slot .next.ready{color:var(--reed)}
.sub-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{background:var(--panel-2);border:2px solid var(--edge);padding:4px 10px;font-family:var(--display);font-size:14px;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--lantern);color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{background:var(--panel-2);border:2px solid var(--edge);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.equipped{border-color:var(--reed)}
.card .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .spec{font-size:13px;color:var(--muted);display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
.card .spec b{color:var(--fg);font-weight:700;font-variant-numeric:tabular-nums}
.card p{font-size:13.5px;color:var(--muted)}
.tag{font-family:var(--display);font-size:12px;padding:1px 6px;border:2px solid var(--edge-hi);color:var(--muted);white-space:nowrap}
.tag.ok{border-color:var(--reed);color:var(--reed)}
.tag.gold{border-color:var(--lantern);color:var(--lantern)}
.price{font-family:var(--display);color:var(--lantern);font-size:16px}

.jcard{align-items:flex-start}
.jcard canvas{image-rendering:pixelated;width:100%;height:auto;background:linear-gradient(#1f3a48,#10202a);border:2px solid #0b1218;aspect-ratio:3/1}
.jcard .sci{font-style:italic;font-size:12.5px;color:var(--muted)}
.jcard.unknown h3{color:var(--muted)}
.tcard canvas{width:100%;height:auto;aspect-ratio:16/9;image-rendering:pixelated;border:2px solid #0b1218;background:#0b1218}
.tcard.here{border-color:var(--lantern)}
.tcard .meta{font-size:13px;color:var(--muted)}
.log{width:100%;border-collapse:collapse;font-size:14px}
.log th{text-align:left;font-family:var(--display);font-weight:400;color:var(--muted);font-size:13px;padding:6px 8px;border-bottom:2px solid var(--edge)}
.log td{padding:6px 8px;border-bottom:1px solid var(--edge);font-variant-numeric:tabular-nums}
.log td.r,.log th.r{text-align:right}
.scroll{overflow-x:auto}
.guide{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.guide .card p{color:var(--fg)}
.guide .card p+p{margin-top:6px}
.keys{font-family:var(--display);color:var(--lantern)}

.modal{position:fixed;inset:0;background:rgba(4,7,10,.72);display:grid;place-items:center;z-index:30;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.catch{background:var(--panel);border:2px solid var(--lantern);box-shadow:0 6px 0 #05080c;width:min(440px,100%);padding:18px;display:flex;flex-direction:column;gap:12px;animation:pop .25s steps(4)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.catch canvas{width:100%;height:auto;image-rendering:pixelated;background:linear-gradient(#24465a,#0f2230);border:2px solid #0b1218}
.catch .badges{display:flex;gap:6px;flex-wrap:wrap}
.catch .facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.catch .facts div{background:var(--panel-2);border:2px solid var(--edge);padding:6px 8px}
.catch .facts small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.catch .facts b{font-family:var(--display);font-size:18px;font-weight:600}
.catch .actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
@media (max-width:560px){
  .fight{grid-template-columns:1fr;gap:3px;bottom:3%}
  .fight label{margin-bottom:0}
    .gauge b{font-size:14px}
  .tab{padding:6px 9px;font-size:14px}
}
@media (max-height:500px){
  .brand p,.gauge small,.stat small{display:none}
  .hud-top{padding-top:calc(env(safe-area-inset-top,0px) + 6px)}
  .menubar .btn{font-size:12px;padding:2px 7px}
  .chipbox{padding:4px 8px}
  .gauge b{font-size:13px}
  .right{gap:4px}
  .lure-pick select{font-size:13px;padding:2px 4px}
  .chipbox .btn{font-size:13px;padding:3px 8px}
  .menu-head .tab{padding:4px 8px;font-size:13px}
}
@media (max-width:640px){.gauge.bite{display:none}.menubar .btn{font-size:12.5px;padding:3px 7px}}
@media (prefers-reduced-motion:reduce){
  .prompt.hot,.fight .tension.strain,.catch{animation:none}
}
</style>

<div class="screen" id="stage" tabindex="0" aria-label="Fishing view. Hold Space or press and hold to cast and reel.">
  <div class="view" id="view">
    <canvas id="game" width="384" height="216"></canvas>
    <div class="prompt" id="prompt"></div>
    <div class="toast" id="toast"></div>
    <div class="meter" id="castMeter" hidden><div class="bar"><i id="castFill"></i></div></div>
    <div class="fight" id="fight" hidden>
      <div class="tension" id="tWrap"><label><span>Line tension</span><span id="tTxt">0 lb</span></label><div class="bar"><i id="tFill"></i></div></div>
      <div class="stam"><label><span id="fName">Fish</span><span id="sTxt">100%</span></label><div class="bar"><i id="sFill"></i></div></div>
      <div class="line"><label><span>Line out</span><span id="lTxt">0 yd</span></label><div class="bar"><i id="lFill"></i></div></div>
    </div>
    <div class="fade" id="fade"><span id="fadeTxt"></span></div>
  </div>

  <header class="hud hud-top">
    <div class="brand">
      <h1>Far <span>Shore</span></h1>
      <p id="locSub">Bennett Hollow Pond · Missouri Ozarks</p>
    </div>
    <div class="right">
      <div class="stats">
        <div class="stat"><small>Cash</small><b class="cash" id="sCash">$0</b></div>
        <div class="stat"><small>Landed</small><b id="sCaught">0</b></div>
        <div class="stat"><small>Species</small><b id="sSpecies">0/51</b></div>
      </div>
      <nav class="menubar ctl" aria-label="Menus">
        <button class="btn shop" type="button" data-open="shop">Shop <span class="muted" style="color:inherit;opacity:.6">S</span></button>
        <button class="btn" type="button" data-open="journal">Journal</button>
        <button class="btn" type="button" data-open="travel">Map</button>
        <button class="btn" type="button" data-open="log">Log</button>
        <button class="btn" type="button" data-open="guide">Help</button>
        <button class="btn" id="sndBtn" type="button" aria-pressed="false">Sound off</button>
        <button class="btn" id="fsBtn" type="button">Full screen</button>
      </nav>
    </div>
  </header>

  <div class="rotate">Turn your phone sideways for a bigger view</div>

  <footer class="hud hud-bottom">
    <div class="chipbox">
      <div class="gauge"><small>Time</small><b id="gClock">6:00 AM</b></div>
      <div class="gauge"><small>Weather</small><b id="gWeather">Clear · 48°F</b></div>
      <div class="gauge"><small>Lure depth</small><b id="gDepth">—</b></div>
      <div class="gauge bite"><small>Bite</small><b id="gBite">Dawn bite</b></div>
    </div>
    <div class="chipbox ctl">
      <label class="lure-pick"><small class="muted" style="font-size:10.5px;text-transform:uppercase;letter-spacing:.1em">Lure</small><select id="lureSel"></select></label>
      <button class="btn" id="restBtn" type="button">Wait 3 h</button>
    </div>
  </footer>
</div>

<div class="menu" id="menu" hidden>
  <div class="menu-win" role="dialog" aria-modal="true" aria-label="Menu">
    <div class="menu-head">
      <nav class="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="shop" aria-selected="true">Tackle Shop</button>
        <button class="tab" role="tab" data-tab="journal" aria-selected="false">Fish Journal</button>
        <button class="tab" role="tab" data-tab="travel" aria-selected="false">Map</button>
        <button class="tab" role="tab" data-tab="log" aria-selected="false">Catch Log</button>
        <button class="tab" role="tab" data-tab="guide" aria-selected="false">How to Fish</button>
      </nav>
      <span class="mcash" id="mCash">$0</span>
      <button class="btn close" id="menuClose" type="button">Back to the water <span style="opacity:.6">Esc</span></button>
    </div>
    <section class="drawer" id="drawer"></section>
  </div>
</div>

<div class="modal" id="catchModal" hidden>
  <div class="catch" id="catchWin" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="cName">
    <div class="row" style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">
      <h2 id="cName">Largemouth Bass</h2><span class="muted" id="cSci" style="font-style:italic;font-size:13px"></span>
    </div>
    <canvas id="cCanvas" width="96" height="40"></canvas>
    <div class="badges" id="cBadges"></div>
    <div class="facts">
      <div><small>Weight</small><b id="cW">3 lb 4 oz</b></div>
      <div><small>Length</small><b id="cL">18 in</b></div>
      <div><small>Market</small><b id="cV" style="color:var(--lantern)">$32</b></div>
    </div>
    <p class="muted" id="cNote" style="font-size:13.5px"></p>
    <div class="actions">
      <button class="btn" id="cRelease" type="button">Release</button>
      <button class="btn primary" id="cSell" type="button">Sell</button>
    </div>
    <p class="muted" style="font-size:12px;text-align:right">Let go of Space, then press it again to sell · R to release</p>
  </div>
</div>

<script>
(()=>{
'use strict';
/* ============================== constants & helpers ============================== */
const W=384,H=216,WY=124,PXYD=4,HPS=24/480,BX=112,REFL=34;
const $=id=>document.getElementById(id);
const cv=$('game'),ctx=cv.getContext('2d');
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.imageSmoothingEnabled=false;return [c,x];}
ctx.imageSmoothingEnabled=false;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, smooth=t=>t*t*(3-2*t);
function rngf(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
const hex=h=>{h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];};
const css=(c,a)=>a==null?`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`:`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const mix=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];
const sh=(c,f)=>f>=0?mix(c,[255,255,255],f):mix(c,[0,0,0],-f);
const BAY=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v=>(v+.5)/16);
const bay=(x,y)=>BAY[((y|0)&3)*4+((x|0)&3)];
function noise1(rng,n){const p=[];for(let i=0;i<=n;i++)p.push(rng());p[n]=p[0];return x=>{x=((x%n)+n)%n;const i=Math.floor(x),f=x-i;return lerp(p[i],p[i+1],smooth(f));};}
function fbm(rng,oct,base){const ns=[];for(let o=0;o<oct;o++)ns.push(noise1(rng,64));return x=>{let s=0,a=1,f=base,t=0;for(let o=0;o<oct;o++){s+=ns[o](x*f)*a;t+=a;a*=.5;f*=2;}return s/t;};}

/* ============================== terrain generators ============================== */
function ridge(rng,o){
  const n=fbm(rng,o.oct||5,o.scale||.01),n2=fbm(rng,3,.06),off=rng()*500,h=new Array(W);
  for(let x=0;x<W;x++){const v=Math.pow(n(x+off),o.sharp||1.3);h[x]=o.base-(o.hMin+v*(o.hMax-o.hMin))-(n2(x+off)-.5)*(o.rough||3);}
  if(o.peaks){const n3=fbm(rng,4,.09);for(const p of o.peaks)for(let x=0;x<W;x++){const d=Math.abs(x-p.x)/p.w;if(d<1){const j=p.smooth?1:(.82+.36*n3(x+off*.3));const y=o.base-p.h*Math.pow(1-d,p.p||1.2)*j-(n2(x*1.7+off)-.5)*(p.r||4);if(y<h[x])h[x]=y;}}}
  return h.map(v=>Math.round(v));
}
function drawPine(b,rng,x,base,h,P,dim){
  const D=sh(hex(P.pine[0]),dim),Lt=sh(hex(P.pine[1]),dim),tier=3+Math.floor(rng()*2);
  for(let r=0;r<h;r++){const y=base-h+r;let hw=r===0?0:Math.floor((r%tier)*.5+r*.2);for(let xx=x-hw;xx<=x+hw;xx++)b.set(xx,y,(xx-(x-hw))<(hw>2?2:1)?Lt:D);}
  b.set(x,base,sh(hex(P.trunk),dim));
}
function drawDecid(b,rng,x,base,h,P,dim,opt={}){
  const pals=P.decid,pal=pals[Math.floor(rng()*pals.length)].map(c=>sh(hex(c),dim));
  const tr=sh(hex(opt.trunk||P.trunk),dim);
  const wide=opt.wide||1,cy=base-Math.round(h*.6),r=Math.max(2,Math.round(h*.32*wide));
  for(let y=cy;y<=base;y++){b.set(x,y,tr);if(opt.birch&&(y*7)%5===0)b.set(x,y,[30,30,30]);}
  if(h>16)b.set(x+1,base,tr);
  const pts=[],n=3+Math.floor(rng()*3);
  for(let i=0;i<n;i++)pts.push([x+Math.round((rng()-.5)*r*1.3*wide),cy+Math.round((rng()-.5)*r*.8),Math.max(2,Math.round(r*(.5+rng()*.35)))]);
  for(const p of pts)b.disc(p[0]+1,p[1]+1,p[2],pal[0]);
  for(const p of pts)b.disc(p[0],p[1],p[2]-1,pal[1]);
  for(const p of pts)b.disc(p[0]-1,p[1]-1,Math.max(1,Math.floor(p[2]*.5)),pal[2]);
  for(let k=0;k<r*2;k++){const xx=x+Math.round((rng()-.6)*r*1.4*wide),yy=cy+Math.round((rng()-.75)*r);if(b.has(xx,yy))b.set(xx,yy,pal[3]);}
}
function drawPalm(b,rng,x,base,h,P,dim){
  const lean=(rng()-.5)*.7;let tx=x,ty=base;
  for(let i=0;i<h;i++){tx=x+lean*i*.5+Math.sin(i/h*2.2)*1.2;ty=base-i;b.set(tx,ty,sh(hex(i%3?'#6a5038':'#8a6a48'),dim));}
  const g1=sh(hex(P.decid[0][1]),dim),g2=sh(hex(P.decid[0][2]),dim);
  for(let k=0;k<7;k++){const a=-Math.PI+k*(Math.PI/6)+(rng()-.5)*.3,len=h*.42+rng()*3;
    for(let t=0;t<len;t++){const fx=tx+Math.cos(a)*t,fy=ty+Math.sin(a)*t*.55+t*t*.05;b.set(fx,fy,t<len*.5?g1:g2);if(t%2===0&&t>2)b.set(fx,fy+1,sh(g1,-.2));}}
}
function drawCypress(b,rng,x,base,h,P,dim){
  const tr=sh(hex(P.trunk),dim);
  for(let i=0;i<h*.8;i++){const y=base-i,w=i<4?3-Math.floor(i/2):0;for(let k=-w;k<=w;k++)b.set(x+k,y,tr);}
  const d=sh(hex(P.decid[0][1]),dim),l=sh(hex(P.decid[0][2]),dim),moss=sh(hex(P.moss||'#8a947a'),dim);
  for(let c=0;c<4;c++){const cx=x+Math.round((rng()-.5)*8),cy=base-h+c*Math.max(2,Math.round(h*.09))+Math.round(rng()*2),rx=3+Math.floor(rng()*4);
    for(let dy=-1;dy<=1;dy++){const w=rx-(dy===-1?1:0);for(let k=-w;k<=w;k++)b.set(cx+k,cy+dy,dy<0||k<-w+2?l:d);}
    for(let s=0;s<3;s++){const sx=cx+Math.round((rng()-.5)*rx*2),len=2+Math.floor(rng()*6);for(let j=1;j<=len;j++)if(rng()<.85)b.set(sx,cy+1+j,moss);}}
}

function buildLoc(L){
  if(L.built)return L;
  const rng=rngf(hashStr(L.id));L.lights=[];L.lamp=null;
  L.layers=L.layers.map(ly=>{const b=new Buf(WY);GEN[ly.g](b,rng,ly.o,L);return {...ly,cv:b.canvas()};});
  // underwater
  const s=hex(L.water.surf),d=hex(L.water.deep),wb=new Buf(H),bands=10;
  for(let y=WY;y<H;y++){const t=Math.pow((y-WY)/(H-WY),.75),v=t*bands,i=Math.floor(v),f=v-i,c0=mix(s,d,i/bands),c1=mix(s,d,Math.min(1,(i+1)/bands));for(let x=0;x<W;x++)wb.set(x,y,f>bay(x,y)?c1:c0);}
  const n=fbm(rng,4,.02);L.bot=new Int16Array(W);
  const bk=L.bottom.kind,bc=mix(hex(L.bottom.col),d,.3);
  for(let x=0;x<W;x++){L.bot[x]=bk==='void'?H+40:Math.round(H-5-n(x)*16);
    for(let y=L.bot[x];y<H;y++){let c=bc;if(y===L.bot[x])c=sh(bc,.15);else if(bk==='sand'&&rng()<.18)c=sh(bc,.1);else if(bk==='mud'&&rng()<.12)c=sh(bc,-.2);else if(rng()<.08)c=sh(bc,-.15);wb.set(x,y,c);}}
  if(bk==='rock'||bk==='cobble'){for(let x=0;x<W;x+=bk==='rock'?6+Math.floor(rng()*10):2+Math.floor(rng()*3)){const r=bk==='rock'?2+Math.floor(rng()*5):1+Math.floor(rng()*2);const c=mix(hex(pick(bk==='rock'?['#6a6460','#5a5654','#7a726a']:['#8a7a60','#6a6a66','#9a8a6a','#7a5a48'])),d,.3);
    const cy=L.bot[x]+1;for(let dy=-r;dy<=r;dy++){const w=Math.floor(Math.sqrt(Math.max(0,r*r-dy*dy+r*.5)));for(let k=-w;k<=w;k++)wb.set(x+k,cy+dy,dy<-r/3&&k<0?sh(c,.18):dy>0?sh(c,-.2):c);}}}
  if(L.bottom.coral){for(let i=0;i<9;i++){const x=Math.floor(rng()*W),cy=L.bot[x],c=mix(hex(pick(['#d86a5a','#e0a040','#9a6ab0','#d8c0a0','#e88aa0'])),d,.25),r=2+Math.floor(rng()*4);
    for(let k=0;k<4;k++){const ox=x+Math.round((rng()-.5)*r*2),oy=cy-Math.round(rng()*r);for(let dy=-r+1;dy<=0;dy++){const w=Math.floor(Math.sqrt(Math.max(0,(r-1)*(r-1)-dy*dy+1)));for(let q=-w;q<=w;q++)wb.set(ox+q,oy+dy,dy<-r/2?sh(c,.15):c);}}}}
  L.waterCv=wb.canvas();
  L.plantList=[];for(let i=0;i<(L.plants.n||0);i++){const x=Math.floor(rng()*W);L.plantList.push({x,ph:rng()*6,h:L.plants.kind==='kelp'?Math.round((L.bot[x]-WY)*(.45+rng()*.45)):L.plants.kind==='grass'?3+Math.floor(rng()*5):L.plants.kind==='lily'?L.bot[x]-WY:8+Math.floor(rng()*18)});}
  L.lilyPads=[];if(L.fx.includes('lilies'))for(let i=0;i<14;i++)L.lilyPads.push({x:Math.floor(rng()*W),w:2+Math.floor(rng()*3),fl:rng()<.25});
  L.plantList.filter(p=>L.plants.kind==='lily').forEach(p=>L.lilyPads.push({x:p.x,w:3,fl:rng()<.3}));
  L.rays=[];for(let i=0;i<7;i++)L.rays.push({x:rng()*W,w:4+rng()*10,s:14+rng()*26,ph:rng()*6});
  L.ftPerPx=L.depthFt/(H-6-WY);
  L.built=true;return L;
}

function genClouds(weather,seed){

  if(has('finlets'))for(let x=b0;x<b0+Math.max(3,Math.round(len*.15));x+=2){put(x,top[x]-1,[232,200,60],'f');put(x,bot[x]+1,[232,200,60],'f');}
  // pectoral fin laid over the flank behind the gill

}

function updParts(dt){
  for(const p of parts){p.life-=dt;
    if(p.t==='drop'){p.vy+=140*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.y>WY+1&&p.vy>0)p.life=0;}
    else if(p.t==='ring'){p.r+=dt*7;}
    else if(p.t==='rain'){p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.y>=WY){p.life=0;if(R()<.3)parts.push({t:'ring',x:p.x,y:WY,life:.5,r:.5});}}

    else if(p.t==='leaf'){p.x+=(Math.sin(T*1.5+p.ph)*10+p.vx)*dt;if(p.y<WY)p.y+=p.vy*dt;else{p.y=WY;p.x+=4*dt;}}
    else if(p.t==='bub'){p.y-=p.vy*dt;p.x+=Math.sin(T*3+p.ph)*4*dt;if(p.y<=WY)p.life=0;}

/* ============================== game logic ============================== */
function doCast(){
  const g=gear(),dist=30+power*(g.rod.cast-30),tx=Math.min(ROD_TIP.x+dist,W-6);
  lure.fly={t:0,dur:.5+power*.5,x0:ROD_TIP.x,y0:ROD_TIP.y,x1:tx,h:18+power*34};lure.x=ROD_TIP.x;lure.y=ROD_TIP.y;
  mode='flying';sfx('cast');
}
function landLure(){
  const g=gear();mode='water';lure.y=WY+1;lure.still=0;lure.moving=0;lure.falling=true;lure.fly=null;splash(lure.x,6,.6);sfx('splash');
  if(g.lure.kind==='bobber')lure.bobDepth=(bottomAt(lure.x)-WY)*.45;
}
function endRetrieve(msg){mode='idle';if(activeFish&&activeFish.state!=='hooked'){activeFish.state='swim';activeFish.wary=3;}activeFish=null;if(msg)toast(msg);}
function spook(f,msg){f.state='flee';f.t=0;f.wary=10;f.dir=f.x>lure.x?1:-1;activeFish=null;if(msg)toast(msg);}
function hookFish(f){
  const g=gear();f.state='hooked';mode='fight';sfx('hook');toast('Fish on!');
  const lineOut=Math.hypot(lure.x-ROD_TIP.x,lure.y-WY)/PXYD+2;
  const endur=1+.5*Math.pow(f.w,.4)*f.sp.fight;
  fight={f,S:1,T:.3,strain:0,slack:0,lineOut,run:0,nextRun:.4+R()*1.2,jump:null,endur,depth:clamp((f.y-WY)/(H-WY),.05,.9),fx:f.x,fy:f.y,pull:0};
}
function updateLure(dt){
  const g=gear(),lu=g.lure;
  if(mode==='charging'){powerT+=dt;const p=(powerT%1.2)/1.2;power=p<.5?p*2:2-p*2;return;}
  if(mode==='flying'){const F=lure.fly;F.t+=dt/F.dur;const t=Math.min(1,F.t);lure.x=lerp(F.x0,F.x1,t);lure.y=lerp(F.y0,WY,t)-Math.sin(Math.PI*t)*F.h;if(t>=1)landLure();return;}
  if(mode!=='water')return;
  const bot=Math.min(bottomAt(lure.x),H-2)-2;
  if(holding&&!(activeFish&&activeFish.state==='bite')){
    const tx=ROD_TIP.x+3,ty=WY+1,dx=tx-lure.x,dy=ty-lure.y,d=Math.hypot(dx,dy),sp=g.reel.speed*PXYD*dt;
    if(d<=sp+2||lure.x<=ROD_TIP.x+4){endRetrieve();return;}
    lure.x+=dx/d*sp;if(lu.kind==='sink')lure.y+=dy/d*sp*.6;
    lure.still=0;lure.moving=.8;
    clickT-=dt;if(clickT<=0){sfx('click');clickT=.07;}
    if(lu.kind==='surface'&&R()<dt*4)parts.push({t:'ring',x:lure.x,y:WY,life:.6,r:.5});
  }else{lure.still+=dt;lure.moving=Math.max(0,lure.moving-dt);
    if(lu.kind==='sink'){if(lure.y<bot){lure.y=Math.min(bot,lure.y+lu.sink*dt);lure.falling=true;}else lure.falling=false;}
  }
  if(lu.kind==='bobber'){lure.bobDepth=Math.min(lure.bobDepth??20,(bottomAt(lure.x)-WY)-3);const ty=WY+lure.bobDepth;lure.y+=Math.sign(ty-lure.y)*Math.min(Math.abs(ty-lure.y),15*dt);}
  if(lu.kind==='surface')lure.y=WY+1;
}
function lureWorking(lu){return lu.act==='any'||(lu.act==='move'?(lure.moving>0||(lu.fall&&lure.falling)):lure.still>.6);}
function updateFish(dt,env){
  const g=gear(),lu=g.lure;tick+=dt;const doTick=tick>=.4;if(doTick)tick=0;
  for(let i=0;i<fish.length;i++){const f=fish[i];f.wary=Math.max(0,f.wary-dt);
    if(f.pdir===undefined)f.pdir=f.dir;if(f.dir!==f.pdir){f.turn=.28;f.fromDir=f.pdir;f.pdir=f.dir;}f.turn=Math.max(0,(f.turn||0)-dt);
    const wag=f.state==='swim'?.9+f.spd*.04:f.state==='chase'?2.2:f.state==='nibble'?1.4:f.state==='bite'?2.6:f.state==='flee'?3.2:f.state==='hooked'?(fight&&fight.jump?4:fight&&fight.run>0?3.4:2):1;
    f.anim=((f.anim||0)+dt*wag*FISH_FRAMES)%(FISH_FRAMES*1000);
    if(f.state==='swim'){f.x+=f.dir*f.spd*dt;f.y+=(f.ty-f.y)*dt*.6;if(R()<dt*.15)f.ty=bandY(f.sp,f.x);if(R()<dt*.03)f.dir*=-1;
      if(f.x<-50||f.x>W+50){fish[i]=spawnFish(true);continue;}
      if(doTick&&mode==='water'&&!activeFish&&!f.wary&&f.sp.lures.includes(lu.id)){
        const n=f.x+f.dir*f.len/2,dist=Math.hypot(lure.x-n,(lure.y-f.y)*1.4);
        const Rr=lu.attract*1.2*(env.night>.5?.8:1)*(.65+L.water.clar*.5);
        if(dist<Rr&&lureWorking(lu)){const wmul=(state.weather==='overcast'||state.weather==='rain')?1.2:1;
          const p=.16*actMult(f.sp,state.hour)*wmul*(1-g.line.vis*L.water.clar*1.5)*(1-dist/Rr*.5);
          if(R()<p){f.state='chase';f.t=0;activeFish=f;}}}
    }else if(f.state==='chase'){f.t+=dt;
      if(mode!=='water'){f.state='swim';activeFish=null;continue;}
      const S=fishSprite(f.sp,f.len);f.dir=lure.x>=f.x?1:-1;const tx=lure.x-f.dir*S.noseOff,ty=lure.y,dx=tx-f.x,dy=ty-f.y,d=Math.hypot(dx,dy);
      const cs=Math.max(f.spd*1.8,(holding?g.reel.speed*PXYD*1.15:0));
      if(d<2.5){
        if(lure.moving>0&&holding){if(R()<g.rod.set+(lu.act==='move'?.1:0)){hookFish(f);sfx('bite');}else spook(f,'Short strike. It missed the hooks.');}
        else{f.state='nibble';f.t=.5+R()*1.1;}
      }else{f.x+=dx/d*Math.min(d,cs*dt);f.y+=dy/d*Math.min(d,cs*dt);}
      if(f.t>5){f.state='swim';f.wary=4;activeFish=null;}
    }else if(f.state==='nibble'){f.t-=dt;const S=fishSprite(f.sp,f.len);f.x=lure.x-f.dir*S.noseOff+Math.sin(T*18)*.6;f.y=lure.y;
      if(f.t<=0){f.state='bite';f.t=.25+.55*g.rod.hook;sfx('bite');}
    }else if(f.state==='bite'){f.t-=dt;const S=fishSprite(f.sp,f.len);f.x=lure.x-f.dir*S.noseOff;f.y=lure.y;
      if(f.t<=0)spook(f,'Missed it. Set the hook when you see BITE.');
    }else if(f.state==='flee'){f.t+=dt;f.x+=f.dir*f.spd*3*dt;if(f.t>1.6)f.state='swim';if(f.x<-50||f.x>W+50)fish[i]=spawnFish(true);}
  }
}
function updateFight(dt){
  if(mode!=='fight'||!fight)return;const g=gear(),F=fight,f=F.f,sp=f.sp,cap=g.line.test*g.rod.power;
  if(F.run>0)F.run-=dt;else{F.nextRun-=dt;if(F.nextRun<=0){F.run=(.6+R()*1.4)*(.6+F.S);F.nextRun=(1.2+R()*2.6)/(.4+F.S*sp.fight*.7);
    if(sp.jump&&R()<.45&&F.S>.15&&!F.jump){F.jump={t:0,dur:.9,checked:false};sfx('jump');}}}
  const running=F.run>0,W8=Math.pow(f.w,.72)*sp.fight;
  const pull=W8*(running?1.9:.85)*(.35+.65*F.S);F.pull=pull;
  // letting go during a run: the drag still loads the line, so tension follows the fish's pull
  const target=holding?(pull+.15*cap)/cap:running?Math.max(.2,pull*.5/cap):(pull*.22)/cap;
  F.T+=(target-F.T)*Math.min(1,dt*(holding?4:3));
  const runSpd=(2.5+4*sp.fight*Math.pow(f.w,.15))*(.5+.5*F.S);
  if(running)F.lineOut+=runSpd*dt*(holding?.55:1);else if(!holding)F.lineOut+=.6*F.S*dt;
  if(holding){const eff=g.reel.speed*clamp(1.15-pull/cap*.9,.25,1);F.lineOut-=(running?eff*.15:eff)*dt;clickT-=dt;if(clickT<=0){sfx('click');clickT=.06;}}
  F.S=Math.max(0,F.S-dt*(.03+.24*F.T)/F.endur);

  if(F.jump){F.jump.t+=dt;if(!F.jump.checked&&F.jump.t>.3){F.jump.checked=true;if(holding&&F.T>.5&&R()<.45)return loseFish('It shook the hook mid-jump. Let off the reel when a fish jumps.');}
    if(F.jump.t>=F.jump.dur){F.jump=null;splash(F.fx,10,1);sfx('splash');}}
  if(F.strain>g.rod.grace){sfx('snap');return loseFish(`Snapped! ${g.line.test} lb line couldn't hold it. Let go when the fish runs, or buy heavier line.`);}
  if(F.slack>3.5&&R()<dt*.8)return loseFish('The line went slack and it threw the hook. Keep some pressure on.');

  const maxPx=W-ROD_TIP.x-10,px=Math.min(F.lineOut*PXYD*.9,maxPx);
  F.depth+=((running?.75:clamp(F.lineOut/18,.05,.6))-F.depth)*dt*.8;

}
function frame(now){if(halted)return;const dt=Math.min(.05,(now-last)/1000);last=now;let env;if(menuOpen){T+=dt;updParts(dt);env=envAt(L,state.hour,state.weather);}else env=update(dt);render(env);

      ${here?'':un?`<button class="btn" data-go="${Lc.id}">Travel</button>`:!okBoat?`<span class="tag">Needs ${BOATS[Lc.tier].name}</span>`:`<button class="btn primary" data-unlock="${Lc.id}" ${afford?'':'disabled'}>Unlock</button>`}</div></div>`;}).join('')}</div>`;
    d.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>goTo(b.dataset.go));
    d.querySelectorAll('[data-unlock]').forEach(b=>b.onclick=()=>{const Lc=LOC[b.dataset.unlock];if(state.money<Lc.cost)return;state.money-=Lc.cost;state.unlocked.push(Lc.id);sfx('buy');goTo(Lc.id);});
    const cvs=[...d.querySelectorAll('canvas[data-th]')];let i=0;const step=()=>{if(i>=cvs.length||tab!=='travel')return;drawThumb(cvs[i]);i++;setTimeout(step,16);};step();
  }else if(tab==='log'){
    d.innerHTML=state.log.length?`<div class="scroll"><table class="log"><thead><tr><th>Fish</th><th class="r">Weight</th><th>Where</th><th>Time</th><th class="r">Earned</th></tr></thead><tbody>
      ${state.log.map(e=>`<tr><td>${SP[e.id].name}${e.rel?' <span class="tag">Released</span>':''}</td><td class="r">${fmtW(e.w)}</td><td>${LOC[e.loc].name}</td><td>${fmtHour(e.h)}</td><td class="r">${money(e.val)}</td></tr>`).join('')}</tbody></table></div>`
      :`<p class="muted">Nothing landed yet. Hold the button or Space to cast, then reel in when you get a bite. Your last 40 fish will show up here.</p>`;
  }else{
    d.innerHTML=`<div class="guide">
      <div class="card"><h3>Cast</h3><p>Press and hold on the water view (or hold <span class="keys">Space</span>). The power bar swings back and forth. Let go at the top for a long cast.</p></div>
      <div class="card"><h3>Work the lure</h3><p>Holding reels in; letting go lets the lure sink. Spinners, cranks, spoons and trolling lures need movement. Worms and cut bait need to sit still. Jigs and spoons also get hit as they fall.</p><p>The gauge under the view shows lure depth. Bottom feeders want it on the bottom.</p></div>
      <div class="card"><h3>Set the hook</h3><p>With still baits a fish nibbles first. Wait. When <span class="keys">BITE!</span> appears, tap at once. Tap early and it spits the bait. Reaction strikes on moving lures hook themselves most of the time; a better rod hooks more.</p></div>
      <div class="card"><h3>Fight</h3><p>Hold to reel, let go to give line. Keep tension out of the red: past your line's breaking strength it snaps. When a fish runs, let go. When it jumps, let go. Slack for too long and it throws the hook.</p><p>Tire the fish before it reaches the boat, or it will surge again.</p></div>
      <div class="card"><h3>Time & weather</h3><p>A day passes in eight minutes. Bass, walleye and salmon feed hardest at dawn and dusk. Catfish and big browns feed at night. Overcast days put fish on the bite.</p></div>
      <div class="card"><h3>Progress</h3><p>Sell fish to buy heavier line, stronger rods, bigger reels, new lures and boats. Boats open new waters. Fish you haven't caught show as dark shadows until your first catch.</p></div>
    </div>`;
  }
}
function equip(id){state.gear[shopCat]=id;if(shopCat==='boat'){populate();}if(shopCat==='lure'&&mode==='water')endRetrieve();save();updateHeader();renderDrawer();}
function goTo(id){if(mode==='fight'){toast('Land or lose this fish first.');return;}closeMenu();travel(id);renderDrawer();}
function drawThumb(c){
  const Lc=buildLoc(LOC[c.dataset.th]);if(!Lc.thumbClouds)Lc.thumbClouds=genClouds('partly',hashStr(Lc.id)+3);
  const x=c.getContext('2d');x.imageSmoothingEnabled=false;
  const env=envAt(Lc,Lc.postcard,'partly');
  drawScenery(x,Lc,env,12.3,{},true);
}

/* ============================== start ============================== */
function start(data){
  load(data);
  travel(state.unlocked.includes(state.loc)?state.loc:'ozark',true);
  if(!state.weather)state.weather='partly';
  renderDrawer();updateHeader();
  requestAnimationFrame(t=>{last=t;requestAnimationFrame(frame);});
}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
window.__fishSprite=fishSprite;window.__sp=SPECIES;window.__lures=LURE;window.__locs=LOC;window.__gear={rod:ROD,reel:REEL,line:LINE,boat:BOAT,lure:LURE};
window.__farShore={halt(){halted=true;},step(n,dt){for(let i=0;i<n;i++){update(dt);if(i%400===0)render(envAt(L,state.hour,state.weather));}},press,release,sell(){catchArmed=true;closeCatch(true);},get fight(){return fight;},get active(){return activeFish;},get lure(){return lure;},get power(){return power;},populate,get state(){return state;},travel:id=>{if(!state.unlocked.includes(id))state.unlocked.push(id);travel(id,true);},setHour:h=>{state.hour=h;},setWeather:w=>{state.weather=w;L.clouds=genClouds(w,5);},get mode(){return mode;},get fish(){return fish;}};
})();
</script>
